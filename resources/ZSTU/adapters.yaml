# resources/ZSTU/adapters.yaml
adapters:
  - adapter_id: "ZSTU_01"
    adapter_name: "浙江理工大学正方教务"
    category: "BACHELOR_AND_ASSOCIATE"
    asset_js_path: "zstu_01.js"
    # ★ 浙理工的 WebVPN 入口选择（2026-11-04 实测对比）
    #
    #   候选一  https://webvpn.zstu.edu.cn/   → 302 → /users/sign_in → /users/auth/cas
    #                                        → 302 → sso-443.webvpn.zstu.edu.cn/login
    #           四层跳转，移动端 WebView 容易卡在中间页
    #
    #   候选二  https://sslvpn.zstu.edu.cn/    → 200 直接落地（含 JS 跳转）
    #           链路短得多，移动端兼容性更好 ✅ 采用
    #
    #   直连教务地址（jwglxt-443.webvpn.zstu.edu.cn/...）不可行：
    #   会显示「用户名或密码错误」—— 那是统一身份认证在拦截，不是密码错。
    #
    #   官方也提示：统一身份认证平台推荐使用谷歌浏览器（兼容性考虑）
    import_url: "https://sslvpn.zstu.edu.cn/"
    maintainer: "constant-er"
    description: "浙江理工大学教务系统课表导入。请先在打开的 WebVPN 门户页用统一身份认证登录（学号密码/微信/钉钉均可），然后在资源列表点击「教务系统」进入教学管理信息服务平台，在左侧「信息查询」→「个人课表查询」选好学年学期并点「查询」，再回到本页执行导入。支持自动读取校历与课程所属校区作息，跨校区课程保留原节次编号并单独使用其校区真实时间。"

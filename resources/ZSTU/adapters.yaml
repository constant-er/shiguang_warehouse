# resources/ZSTU/adapters.yaml
adapters:
  - adapter_id: "ZSTU_01"
    adapter_name: "浙江理工大学正方教务"
    category: "BACHELOR_AND_ASSOCIATE"
    asset_js_path: "zstu_01.js"
    # ★ 浙理工 WebVPN 入口（2026-11-04/05 实测确认）
    #
    #   https://webvpn.zstu.edu.cn/  ← 正确入口
    #     → 302 → /users/sign_in
    #     → 302 → /users/auth/cas
    #     → 302 → sso-443.webvpn.zstu.edu.cn/login（统一身份认证平台）
    #     落地 HTTP 200，正常下发 SESSION / SERVERID cookie
    #
    #   直连教务地址（jwglxt-443.webvpn.zstu.edu.cn/...）不可行：
    #   WebVPN 会话是「门户域 → 资源子域」绑定的，
    #   必须先在门户登录并点一次「教务系统」，才会下发该子域的授权 cookie，
    #   否则会显示「用户名或密码错误」—— 那是统一身份认证在拦，不是密码错。
    #
    #   官方提示：统一身份认证平台推荐使用谷歌浏览器（兼容性考虑）
    import_url: "https://webvpn.zstu.edu.cn/"
    maintainer: "constant-er"
    description: "浙江理工大学教务系统课表导入。请先在打开的 WebVPN 门户页用统一身份认证登录（学号密码/微信/钉钉均可），然后在资源列表点击「教务系统」进入教学管理信息服务平台，在左侧「信息查询」→「个人课表查询」选好学年学期并点「查询」，再回到本页执行导入。支持自动读取校历与课程所属校区作息，跨校区课程保留原节次编号并单独使用其校区真实时间。"
